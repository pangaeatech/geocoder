[tool.poetry]
name = "Geocoder"
version = "0.0.0"
description = "Pangaea IT Geocoder"
authors = ["Pangaea Information Technologies, Ltd."]
readme = "README.md"
repository = "https://github.com/pangaeatech/geocoder"

[tool.poetry.scripts]
geocoder = "src.geocoder:main"

[tool.black]
line-length = 150
target-version = ['py38']
include = '\.pyi?$'

[tool.mypy]
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true

[tool.poetry.dependencies]
openpyxl = "3.1.5"
python = ">=3.10.0,<3.15.0"
requests = "2.34.2"

[tool.poetry.group.dev.dependencies]
black = "26.5.1"
coverage = "7.16.1"
pdoc = "16.0.0"
pylint = "4.0.9"
pytest = "9.1.1"
mypy = "2.3.1"
types-openpyxl = "^3.1.5.20260827"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
