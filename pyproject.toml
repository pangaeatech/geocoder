[tool.poetry]
name = "Geocoder"
version = "0.0.0"
description = "Pangaea IT Geocoder"
authors = ["Pangaea Information Technologies, Ltd."]
readme = "README.md"
repository = "https://github.com/pangaeatech/geocoder"
package-mode = false

[tool.black]
line-length = 150
target-version = ['py38']
include = '\.pyi?$'

[tool.poetry.dependencies]
black = "25.12.0"
coverage = "7.10.7"
openpyxl = "3.1.5"
pdoc = "15.0.4"
pylint = "4.0.6"
pytest = "9.1.1"
python = ">=3.10.0,<3.14.0"
requests = "2.34.2"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
